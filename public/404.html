<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page introuvable · Éli Bousquet</title>
    <meta name="robots" content="noindex" />
    <script>
      // GitHub Pages only serves real files, so refreshing (or opening a link to)
      // an in-app route such as /projet/... or /declaration-ia lands here.
      // For those routes, hand the path over to the app (index.html restores it
      // with history.replaceState, see the matching snippet there).
      // Anything else is a genuine 404 and shows the page below.
      (function () {
        var l = window.location;
        var appRoute = /^\/(projet\/[^/]+|declaration-ia)\/?$/;
        if (appRoute.test(l.pathname)) {
          l.replace(
            l.protocol +
              "//" +
              l.hostname +
              (l.port ? ":" + l.port : "") +
              "/?/" +
              l.pathname.slice(1).split("&").join("~and~") +
              (l.search ? "&" + l.search.slice(1).split("&").join("~and~") : "") +
              l.hash,
          );
        }
      })();
    </script>
    <style>
      @font-face {
        font-family: "Poppins:Black";
        src: url("https://static.figma.com/font/Poppins-Black_4") format("woff2");
        font-weight: 900;
        font-display: swap;
      }
      @font-face {
        font-family: "Poppins:SemiBold";
        src: url("https://static.figma.com/font/Poppins-SemiBold_6") format("woff2");
        font-weight: 600;
        font-display: swap;
      }
      @font-face {
        font-family: "Poppins:Regular";
        src: url("https://static.figma.com/font/Poppins-Regular_6") format("woff2");
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: "Cousine:Bold";
        src: url("https://static.figma.com/font/Cousine-Bold_2") format("woff2");
        font-weight: 700;
        font-display: swap;
      }
      :root {
        --bg: #0d0d0d;
        --text: #e9e9e9;
        --muted: #878787;
        --primary: #a40000;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 24px;
        overflow: hidden;
        background:
          radial-gradient(ellipse 700px 420px at 50% 45%, rgba(164, 0, 0, 0.16), transparent 70%),
          var(--bg);
        color: var(--text);
        font-family: "Poppins:Regular", Poppins, sans-serif;
        text-align: center;
      }
      main {
        width: 100%;
        max-width: 640px;
      }
      .tag {
        display: inline-block;
        color: var(--primary);
        font-family: "Cousine:Bold", monospace;
        font-size: 12px;
        letter-spacing: 5px;
        text-transform: uppercase;
      }
      h1 {
        margin: 12px 0 4px;
        font-family: "Poppins:Black", Poppins, sans-serif;
        font-size: clamp(96px, 26vw, 210px);
        font-weight: 900;
        line-height: 1;
        letter-spacing: -2px;
        animation: flicker 4.5s infinite;
      }
      h1 span {
        color: var(--primary);
        text-shadow: 0 0 28px rgba(164, 0, 0, 0.55);
      }
      .bolt {
        display: block;
        width: min(360px, 80%);
        height: 28px;
        margin: 0 auto 28px;
      }
      .bolt path {
        fill: none;
        stroke: #ffaaaa;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 0 6px #a40000) drop-shadow(0 0 14px #a40000);
        stroke-dasharray: 420;
        stroke-dashoffset: 420;
        animation: zap 3.2s ease-out infinite;
      }
      h2 {
        font-family: "Poppins:SemiBold", Poppins, sans-serif;
        font-size: clamp(20px, 4vw, 26px);
        font-weight: 600;
      }
      p {
        max-width: 460px;
        margin: 12px auto 36px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.7;
      }
      a {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        padding: 0 26px;
        border: 1.325px solid var(--primary);
        border-radius: 3px;
        background: rgba(164, 0, 0, 0.06);
        color: var(--text);
        font-family: "Poppins:SemiBold", Poppins, sans-serif;
        font-size: 12px;
        letter-spacing: 3px;
        text-decoration: none;
        text-transform: uppercase;
        transition:
          background 0.2s,
          box-shadow 0.2s;
      }
      a:hover,
      a:focus-visible {
        outline: 0;
        background: var(--primary);
        box-shadow: 0 0 24px rgba(164, 0, 0, 0.45);
      }
      @keyframes zap {
        0% { stroke-dashoffset: 420; opacity: 1; }
        22% { stroke-dashoffset: 0; opacity: 1; }
        40% { opacity: 0.2; }
        46% { opacity: 1; }
        70% { stroke-dashoffset: 0; opacity: 0; }
        100% { stroke-dashoffset: 0; opacity: 0; }
      }
      @keyframes flicker {
        0%, 92%, 96%, 100% { opacity: 1; }
        94% { opacity: 0.82; }
        98% { opacity: 0.9; }
      }
      @media (prefers-reduced-motion: reduce) {
        h1, .bolt path { animation: none; stroke-dashoffset: 0; }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="tag">Erreur · 404</span>
      <h1>4<span>0</span>4</h1>
      <svg class="bolt" viewBox="0 0 360 28" aria-hidden="true">
        <path d="M2 14 L48 10 L70 20 L112 6 L140 22 L182 8 L206 19 L248 5 L276 21 L318 11 L358 15" />
      </svg>
      <h2>Page introuvable</h2>
      <p>
        La page que vous cherchez n’existe pas, ou a été déplacée. Retournez à
        l’accueil pour retrouver mes projets.
      </p>
      <a href="/">← Retour à l’accueil</a>
    </main>
  </body>
</html>
